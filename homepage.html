<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>Dear aisha</strong>
                        <p>
                            I love when i meet you, you're my angle, you're my pretty.<br><br>
                            With love
                             
                        </p>
                    </div>
                </div>
                <div class="heart"></div>
            </div>
        </div>
    </div>

    <script>
        const envelope = document.querySelector(".envelope-wrapper");
        envelope.addEventListener('click', ()=>{
            envelope.classList.toggle('flap')
        })
    </script>
    
</body>
</html>
